name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release @ixo/domain.md
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write # git tags and GitHub releases
      issues: write # release comments on closed issues
      pull-requests: write # release comments on merged pull requests
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only set for the very first publish of a new package; trusted publishing takes over afterwards.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/exec@7.0.0
          -p conventional-changelog-conventionalcommits@10.4.1
          semantic-release
